# Render blueprint for the mkt_studio backend.
# 1. Create a MongoDB Atlas cluster (free M0 — it's a replica set by default).
# 2. In Render: New → Blueprint → point at this repo.
# 3. Fill the secret env vars marked `sync: false` (DATABASE_URL, keys, URLs).
services:
  - type: web
    name: mkt-studio-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # --- Fill these in the Render dashboard (they hold secrets / URLs) ---
      - key: DATABASE_URL # mongodb+srv://...  (Atlas connection string)
        sync: false
      - key: TOKEN_ENCRYPTION_KEY # 32-byte hex — `openssl rand -hex 32`. Set once, never rotate:
        sync: false #                it decrypts stored Meta tokens.
      - key: API_BASE_URL # https://mkt-studio-api.onrender.com
        sync: false
      - key: WEB_BASE_URL # https://your-frontend.vercel.app  (also the CORS allow-list)
        sync: false
      # --- CORS (optional) ---
      # Preview deploys of the WEB_BASE_URL Vercel project are allowed automatically.
      - key: VERCEL_PROJECT_NAME # only needed when production is on a custom domain
        sync: false
      - key: CORS_EXTRA_ORIGINS # comma-separated extra origins, e.g. a staging frontend
        sync: false
      # --- Optional integrations (leave blank to use mock/keyless modes) ---
      - key: CLOUDINARY_CLOUD_NAME # strongly recommended in production: without it
        sync: false #                uploads and renders land on the ephemeral disk
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # AI copy (OpenRouter). Blank → the built-in mock copywriter.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_URL # blank → https://openrouter.ai/api/v1/chat/completions
        sync: false
      - key: OPENROUTER_MODEL # blank → nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
        sync: false
      # Image generation. Blank → `pollinations`, which is keyless and needs no setup.
      # Other options: gemini | stability | openai | replicate (each needs its key below).
      - key: IMAGE_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v21.0
